<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:500;src:url(../motor/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../motor/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../motor/fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../motor/fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(../motor/fonts/inter-latin-900-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(../motor/fonts/jetbrains-mono-latin-700-normal.woff2)}
body{margin:0}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../motor/engine.js"></script><script src="../motor/aula.js"></script><script>
// Teste rápido de uma cena: quadro(tipo, cena, t, dur) → PNG (dataURL)
window.quadro = async (tipo, s, t, dur, imgs) => {
  const media = {}; for (const [k, src] of Object.entries(imgs || {})) { const im = new Image(); im.src = src; await im.decode(); media[k] = { img: im }; }
  for (const w of [500, 600, 700, 800, 900]) await document.fonts.load(w + " 40px Inter"); await document.fonts.load("700 40px 'JetBrains Mono'");
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"); const W = 1080, H = 1920;
  const g = ctx.createRadialGradient(W/2, H*0.45, 100, W/2, H*0.45, 1100); g.addColorStop(0, "#14301f"); g.addColorStop(1, "#08090c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  COEngine.SCENES[tipo](ctx, { W, H, vertical: true, u: 1, cx: W / 2, cy: H * 0.40 }, t, dur, s, media);
  return cv.toDataURL("image/png");
};
</script></body></html>
