<!doctype html><html lang='pt-BR'><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--ac:#c0392b}@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#aaa}}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px 16px}
h1{color:var(--ac)}small,.m{color:var(--mut)}a{color:var(--ac)}</style><title>Autorização TikTok</title></head><body><h1>Autorização do TikTok</h1><p id="r">Lendo…</p>
<script>const q=new URLSearchParams(location.search);const c=q.get('code'),e=q.get('error');
document.getElementById('r').innerHTML=c?'Autorizado. Copie o código abaixo e use só onde a fábrica pede (não compartilhe):<pre style="white-space:pre-wrap;word-break:break-all">'+c.replace(/[<>&]/g,'')+'</pre>':(e?'Erro: '+e.replace(/[<>&]/g,''):'Nada para mostrar.');</script></body></html>
