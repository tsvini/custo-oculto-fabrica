<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojinha do Leigo · Entrar</title><link rel="icon" href="img/logo.svg"><link rel="stylesheet" href="estilo.css"></head>
<body>
<div class="entrada">
  <section class="vitrine"><img class="enfeite e1" src="img/caneca.svg" alt=""><img class="enfeite e2" src="img/fone.svg" alt=""><img class="enfeite e3" src="img/caderno.svg" alt=""><img class="logo" src="img/logo.svg" alt="Lojinha do Leigo"><div id="marca"></div><p>A loja de treino do curso <b style="color:#fff">Playwright para Leigos</b></p></section>
  <form class="caixa" data-test="form-login">
    <h2>Que bom te ver! 👋</h2><p class="sub">Entre pra ver as ofertas da semana · <span data-test="versao"></span></p>
    <label for="usuario">Usuário</label><input id="usuario" data-test="usuario" placeholder="Seu usuário" autocomplete="off">
    <label for="senha">Senha</label><input id="senha" data-test="senha" type="password" placeholder="Sua senha">
    <button class="principal" type="submit" data-test="entrar">Entrar</button>
    <div class="erro" data-test="erro" role="alert" hidden></div>
    <p class="dica">Usuários de treino: <b>cliente</b> e <b>bloqueado</b><br>Senha dos dois: <b>leigo123</b></p>
  </form>
</div>
<script src="loja.js"></script>
<script>
document.getElementById('marca').innerHTML = MARCA(false);
document.querySelector('[data-test="versao"]').textContent = 'versão ' + VERSAO;
document.querySelector('[data-test="form-login"]').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.querySelector('[data-test="usuario"]').value.trim(), s = document.querySelector('[data-test="senha"]').value;
  const erro = document.querySelector('[data-test="erro"]'); erro.hidden = false;
  if (!u) return (erro.textContent = 'Informe o usuário.');
  if (!s) return (erro.textContent = 'Informe a senha.');
  const conta = USUARIOS[u];
  if (!conta || conta.senha !== s) return (erro.textContent = 'Usuário ou senha incorretos.');
  if (conta.bloqueado) return (erro.textContent = 'Este usuário está bloqueado. Fale com o suporte.');
  sessionStorage.setItem('usuario', u); location.href = 'produtos.html';
});
</script></body></html>
