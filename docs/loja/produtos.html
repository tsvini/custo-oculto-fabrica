<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojinha do Leigo · Produtos</title><link rel="icon" href="img/logo.svg"><link rel="stylesheet" href="estilo.css"></head>
<body>
<main>
  <section class="banner"><div class="txt"><span class="tag">SEMANA DO TESTADOR</span><h3>Tudo pra você <em>passar no CI</em> de primeira</h3><p>Até 30% de desconto e frete grátis acima de R$ 99</p></div><div class="cena"><img class="i1" src="img/caneca.svg" alt=""><img class="i2" src="img/mochila.svg" alt=""><img class="i3" src="img/fone.svg" alt=""></div></section>
  <section class="selos"><div><span>🚚</span><div>Frete grátis<small>acima de R$ 99</small></div></div><div><span>💳</span><div>Até 3x sem juros<small>no cartão</small></div></div><div><span>↩️</span><div>Troca fácil<small>em até 7 dias</small></div></div></section>
  <div class="barra"><div><h2 data-test="titulo">Produtos</h2><p class="sub" data-test="quantidade"></p></div>
    <div><label for="ordenar">Ordenar por</label><select id="ordenar" data-test="ordenar">
      <option value="az">Nome (A a Z)</option><option value="za">Nome (Z a A)</option>
      <option value="menor">Preço (menor para maior)</option><option value="maior">Preço (maior para menor)</option>
    </select></div></div>
  <div data-test="lista" class="grade"></div>
</main>
<footer><div><span class="marca"><span class="palavra"><span class="l1">lojinha</span><span class="l2"><small>do</small>leigo</span></span></span><span>Loja de treino do curso Playwright para Leigos · nenhuma compra é de verdade 😉</span></div></footer>
<script src="loja.js"></script>
<script>
if (!sessionStorage.getItem('usuario')) location.href = 'index.html';
const CATEGORIAS = ['Papelaria', 'Casa', 'Acessórios', 'Roupas', 'Eletrônicos'];
cabecalho(CATEGORIAS);
document.querySelector('[data-test="sair"]').onclick = () => { sessionStorage.removeItem('usuario'); location.href = 'index.html'; };
let produtos = [], noCarrinho = 0, categoria = 'Todos';
const lista = document.querySelector('[data-test="lista"]'), ordem = document.querySelector('[data-test="ordenar"]'), busca = document.querySelector('[data-test="busca"]');
function ordenar(ps, modo) {
  const c = ps.slice();
  if (modo === 'az') c.sort((a, b) => a.nome.localeCompare(b.nome));
  if (modo === 'za') c.sort((a, b) => b.nome.localeCompare(a.nome));
  if (VERSAO === 1 && (modo === 'menor' || modo === 'maior')) {  // o bug da versão 1: compara o preço como texto ("129.9" < "15.99" < "7.99")
    c.sort((a, b) => String(a.preco).localeCompare(String(b.preco)));
    if (modo === 'maior') c.reverse();
    return c;
  }
  if (modo === 'menor') c.sort((a, b) => a.preco - b.preco);
  if (modo === 'maior') c.sort((a, b) => b.preco - a.preco);
  return c;
}
const estrelas = (n) => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
const SELO = { 'Oferta': 'oferta', 'Novo': 'novo', 'Mais vendido': 'vendido' };
function cartao(p) {
  const off = p.precoAntigo ? Math.round((1 - p.preco / p.precoAntigo) * 100) : 0;
  return `<div class="produto" data-test="produto">
    <div class="foto">${p.selo ? `<span class="selo ${SELO[p.selo] || ''}">${p.selo}</span>` : ''}${p.imagem ? `<img src="${p.imagem}" alt="${p.nome}">` : ''}${p.estoque ? '' : '<span class="esgotado" data-test="esgotado">Esgotado</span>'}</div>
    <div class="info"><span class="cat">${p.categoria || ''}</span><span class="nome" data-test="nome">${p.nome}</span>
    ${p.avaliacao ? `<span class="estrelas">${estrelas(p.avaliacao)}<small>${String(p.avaliacao).replace('.', ',')} (${p.avaliacoes})</small></span>` : ''}
    <div class="de">${p.precoAntigo ? `<span class="antigo">${real(p.precoAntigo)}</span><span class="desconto">-${off}%</span>` : ''}</div>
    <span class="preco" data-test="preco">${real(p.preco)}</span>
    <span class="parcela">ou 3x de ${real(p.preco / 3)} sem juros</span><span class="frete">${p.preco >= 99 ? 'Frete grátis' : ''}</span>
    <button data-test="adicionar" ${p.estoque ? '' : 'disabled'}>${p.estoque ? 'Adicionar ao carrinho' : 'Indisponível'}</button></div></div>`;
}
function mostrar() {
  const termo = busca.value.trim().toLowerCase();
  const visiveis = produtos.filter((p) => (categoria === 'Todos' || p.categoria === categoria) && (!termo || p.nome.toLowerCase().includes(termo)));
  document.querySelector('[data-test="quantidade"]').textContent = produtos.length ? `${visiveis.length} ${visiveis.length === 1 ? 'produto' : 'produtos'}` : '';
  if (!visiveis.length) { lista.className = ''; lista.innerHTML = '<div class="aviso" data-test="vazio">Nenhum produto encontrado.</div>'; return; }
  lista.className = 'grade'; lista.innerHTML = ordenar(visiveis, ordem.value).map(cartao).join('');
  lista.querySelectorAll('[data-test="adicionar"]').forEach((b) => (b.onclick = () => {
    noCarrinho++; const c = document.querySelector('[data-test="contador-carrinho"]'); c.hidden = false; c.textContent = noCarrinho; b.textContent = 'Adicionado ✓'; b.classList.add('ok'); b.disabled = true; }));
}
ordem.onchange = mostrar; busca.oninput = mostrar;
document.querySelectorAll('[data-test="categoria"]').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('[data-test="categoria"]').forEach((x) => x.classList.remove('ativa')); b.classList.add('ativa'); categoria = b.textContent; mostrar(); }));
fetch('api/produtos.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { produtos = d; mostrar(); })
  .catch(() => { lista.className = ''; lista.innerHTML = '<div class="aviso erro" data-test="erro-carregar">Não foi possível carregar os produtos. Tente de novo mais tarde.</div>'; });
</script></body></html>
