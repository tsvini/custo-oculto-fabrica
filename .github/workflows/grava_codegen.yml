name: Gravar codegen de verdade
# Abre o "npx playwright codegen" numa tela virtual (Xvfb), comanda mouse/teclado com xdotool e grava a tela com ffmpeg.
on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "script em ferramentas/codegen/ (ex.: sonda.sh)"
        required: true
        default: "sonda.sh"
jobs:
  gravar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: curso-playwright/projeto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ferramentas da tela virtual (apt com limite de tempo e nova tentativa)
        run: |
          P="xvfb xdotool ffmpeg x11-utils openbox"
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2 install -y -qq $P > /dev/null && break
            sudo pkill -9 -f apt-get || true; sudo dpkg --configure -a || true
            timeout 120 sudo apt-get -o Acquire::http::Timeout=20 update -qq || true
          done
          which Xvfb xdotool ffmpeg openbox
      - name: Gravar
        run: bash ../../ferramentas/codegen/${{ inputs.roteiro }}
      - name: Mandar pra release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la cg_saida || true
          for f in cg_saida/*; do gh release upload bastidores "$f" --clobber -R ${{ github.repository }} || true; done
