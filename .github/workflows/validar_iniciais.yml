name: Validar projetos iniciais do Playwright
# Cada projeto inicial (curso-playwright/material/projetos-iniciais/*) roda do jeito que o aluno faria: npm install, .env, e os testes.
on:
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar cada projeto
        env:
          CI: ""
        run: |
          falhou=0
          for d in curso-playwright/material/projetos-iniciais/*/; do
            n=$(basename "$d"); w=/tmp/aluno/$n; mkdir -p $w; cp -r "$d". $w/
            cd $w
            [ -f .env.example ] && cp .env.example .env
            npm install --silent >/dev/null 2>&1 || { echo "::error title=$n::npm install falhou"; falhou=1; cd - >/dev/null; continue; }
            [ -z "$PW" ] && { timeout 300 npx playwright install --with-deps chromium >/dev/null 2>&1 || npx playwright install chromium >/dev/null 2>&1; PW=1; }
            if npx playwright test --project=chromium --reporter=line > saida.txt 2>&1; then echo "::notice title=$n::$(grep -E 'passed|failed' saida.txt | tail -2 | tr '\n' ' ')"; else falhou=1; echo "::error title=$n::$(tail -15 saida.txt | tr '\n' ' ' | cut -c1-900)"; fi
            cd - >/dev/null
          done
          exit $falhou
