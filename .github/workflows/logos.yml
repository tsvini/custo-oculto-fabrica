name: Baixar logos

# Baixa os logos do projeto (campo "logos" do projeto.json) para projetos/<nome>/midia/.
on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "pasta em projetos/"
        required: true
  push:
    paths: ["projetos/*/logos.txt"]

jobs:
  logos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        env:
          PROJETO: ${{ inputs.projeto }}
        run: |
          pip install -q pillow requests
          lista="$PROJETO"
          [ -z "$lista" ] && lista=$(git diff --name-only HEAD~1 HEAD -- 'projetos/*/logos.txt' | cut -d/ -f2 | sort -u | xargs)
          for p in $lista; do python ferramentas/baixar_logos.py "$p" | tee -a "$GITHUB_STEP_SUMMARY"; done
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add projetos/*/midia && git commit -q -m "Logos baixados [skip ci]" && git pull --rebase --autostash -q && git push -q || true
