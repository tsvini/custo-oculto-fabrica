name: Conectar TikTok

# Troca o código de autorização do TikTok pelo token e guarda criptografado (tiktok_token.enc).
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "código que apareceu na página de retorno do TikTok"
        required: true

jobs:
  conectar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CODIGO: ${{ inputs.codigo }}
        run: |
          echo "::add-mask::$CODIGO"
          python -m fabrica.tiktok_auth "$CODIGO"
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add tiktok_token.enc && git commit -q -m "TikTok conectado [skip ci]" && git pull --rebase -q && git push -q
