name: Depurar gravação
on:
  workflow_dispatch:
jobs:
  dbg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - run: python ferramentas/depura_gravacao.py 2>&1 | tee dbg_log.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dbg_log.txt dbg/ ; cd dbg && for f in *.png *.txt; do gh release upload bastidores "$f" --clobber -R ${{ github.repository }} || true; done
