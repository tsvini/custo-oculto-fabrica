name: Imagens IA em lote
on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "imagens/<lote>.json"
        required: true
jobs:
  img:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: |
          pip install -q requests pillow
          python -m fabrica.imagens_lote ${{ github.event.inputs.arquivo }}
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add imagens && git commit -q -m "Imagens IA [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
