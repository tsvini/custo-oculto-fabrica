name: Transcrever áudio (palavra por palavra)
on:
  workflow_dispatch:
    inputs:
      nome:
        description: "arquivo em legendas/<nome>.wav"
        required: true
      modelo:
        description: "modelo do faster-whisper"
        default: large-v3
jobs:
  tr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper
      - run: |
          python -m fabrica.transcrever ${{ github.event.inputs.nome }} ${{ github.event.inputs.modelo }}
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add legendas/*.json; git commit -qm "transcrição ${{ github.event.inputs.nome }}"; for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
