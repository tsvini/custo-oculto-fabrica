name: Transcrever áudio (palavra por palavra)
on:
  workflow_dispatch:
    inputs:
      nome:
        description: "arquivo em legendas/<nome>.wav"
        required: true
      modelo:
        description: "modelo do faster-whisper"
        default: large-v3
jobs:
  tr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper
      - run: |
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel
          n="${{ github.event.inputs.nome }}"
          m=WhisperModel("${{ github.event.inputs.modelo }}",device="cpu",compute_type="int8")
          segs,_=m.transcribe(f"legendas/{n}.wav",language="pt",word_timestamps=True,beam_size=5)
          out=[[round(w.start,2),round(w.end,2),w.word.strip()] for s in segs for w in s.words]
          json.dump(out,open(f"legendas/{n}.json","w"),ensure_ascii=False)
          print(" ".join(w[2] for w in out))
          PY
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add legendas/*.json; git commit -qm "transcrição ${{ github.event.inputs.nome }}"; git pull -q --rebase; git push -q
