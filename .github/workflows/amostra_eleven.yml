name: Amostra ElevenLabs

on:
  push:
    paths: ["amostras/eleven.txt"]

jobs:
  amostra:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
        run: |
          pip install -q requests
          python -m fabrica.eleven_amostra
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add amostras && git commit -q -m "Amostras ElevenLabs [skip ci]" && git pull --rebase -q && git push -q || true
