name: Separar mídia para redes

# Quando uma geração termina, separa Shorts/TikToks (mp4, capas e textos) no branch "midia"
# para serem publicados no repositório público custo-oculto-midia e agendados no Metricool.
on:
  workflow_run:
    workflows: ["Gerar vídeo"]
    types: [completed]

jobs:
  separar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dl
      - name: Branch midia
        shell: bash
        run: |
          mkdir -p out
          find dl \( -name "*_short*.mp4" -o -name "*tiktok*.mp4" -o -name "capa_tiktok*.jpg" -o -name "publicar_short*.txt" -o -name "publicar_tiktok*.txt" \) | while read f; do
            slug=$(basename "$(dirname "$f")"); mkdir -p "out/$slug"; cp "$f" "out/$slug/"
          done
          if [ -z "$(ls -A out)" ]; then echo "nada para separar"; exit 0; fi
          cd out
          git init -q -b midia && git config user.name "fabrica-custo-oculto" && git config user.email "fabrica@users.noreply.github.com"
          git add -A && git commit -q -m "Mídia da execução ${{ github.event.workflow_run.id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" midia
          echo "::notice title=Mídia separada::$(find . -name '*.mp4' | wc -l) vídeo(s) no branch midia"
