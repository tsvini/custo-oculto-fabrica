name: Reparar registro do YouTube

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "reconstruir | ia | ia <ids separados por vírgula>"
        default: reconstruir

jobs:
  reparar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Reconstruir publicados.json a partir do YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_QA: ${{ secrets.YT_REFRESH_TOKEN_QA }}
        run: |
          if [ "${{ inputs.acao }}" = resumo ]; then python -m fabrica.resumo; else python -m fabrica.publicar ${{ inputs.acao || 'reconstruir' }}; fi
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git add publicados.json && git commit -m "Registro reconstruído [skip ci]" && for t in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
