name: Publicar no YouTube

# Sobe o que ficou na fila (cota diária da API) e agenda. Roda todo dia às 8h de Brasília.
on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      liberar:
        description: "publicar agora (ex.: netflix-en_longo)"
        required: false
  push:
    paths: [".github/workflows/publicar.yml"]

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      YT_REFRESH_TOKEN_QA: ${{ secrets.YT_REFRESH_TOKEN_QA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar fila
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIBERAR: ${{ inputs.liberar }}
          PODCAST_TOKEN: ${{ secrets.PODCAST_TOKEN }}
          PODCAST_EMAIL: ${{ secrets.PODCAST_EMAIL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          pip install -q requests
          python -m fabrica.publicar conferir
          python -m fabrica.publicar enviar
          python -m fabrica.viniqa || echo "vini qa falhou"
          if [ -n "$LIBERAR" ]; then python -m fabrica.publicar liberar "$LIBERAR"; fi
          python -m fabrica.publicar playlists
          python -m fabrica.publicar comentar
          python -m fabrica.podcast feed || echo "podcast falhou"
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          if [ -n "$(git status --porcelain publicados.json comentarios.json publicados_viniqa.json viniqa_status.txt)" ]; then
            git add publicados.json comentarios.json $(ls publicados_viniqa.json viniqa_status.txt 2>/dev/null) && git commit -m "Agenda do YouTube atualizada [skip ci]" && for t in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && break; sleep 8; done
          fi
