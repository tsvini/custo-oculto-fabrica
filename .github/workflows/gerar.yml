name: Gerar vídeo

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "Projeto (nome da pasta em projetos/, ex.: kolynos)"
        required: true
      formato:
        description: "O que gerar"
        type: choice
        options: [tudo, longo, shorts, short1, short2, short3, tiktoks, tiktok1, tiktok2, tiktok3, tiktok4]
        default: tudo
      voz:
        description: "Trocar a voz sintética (só para modo google)"
        required: false
        default: ""
      modo:
        description: "gravada = seus áudios em projetos/<nome>/audio · teste = voz falsa · google = Chirp 3 HD (precisa de chave)"
        type: choice
        options: [gravada, teste, google]
        default: gravada
  push:
    paths: ["projetos/*/projeto.json", "projetos/*/audio/**", "projetos/*/regerar.txt"]

concurrency:
  group: gerar-${{ github.ref }}-${{ inputs.projeto || 'push' }}
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir projeto
        id: alvo
        shell: bash
        env:
          PROJETO: ${{ inputs.projeto }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lista="$PROJETO"
          else
            # primeiro commit não tem HEAD~1: compara com a árvore vazia
            if git rev-parse -q --verify HEAD~1 > /dev/null; then base=HEAD~1; else base=$(git hash-object -t tree /dev/null); fi
            mudou=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- 'projetos/*/projeto.json' 'projetos/*/audio/*' 'projetos/*/regerar.txt')
            lista=$(echo "$mudou" | { grep . || true; } | cut -d/ -f2 | sort -u | xargs)
            # só áudio de Short mudou? gera só os Shorts
            if [ -n "$mudou" ] && ! echo "$mudou" | grep -viq '/audio/shorts\?[0-9]'; then echo "formato=shorts" >> "$GITHUB_OUTPUT"; fi
            # só áudio de TikTok mudou? gera só os TikToks
            if [ -n "$mudou" ] && ! echo "$mudou" | grep -viq '/audio/tiktok[0-9]'; then echo "formato=tiktoks" >> "$GITHUB_OUTPUT"; fi
            # regerar.txt: a primeira palavra diz o formato (tudo, longo, shorts, short1…)
            r=$(echo "$mudou" | { grep '/regerar.txt$' || true; } | head -1)
            if [ -n "$r" ]; then
              echo "formato=$(head -1 "$r" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
              # segunda palavra "teste" = voz falsa (prévia antes de gravar; nunca vai para o YouTube)
              if head -1 "$r" | awk '{print $2}' | grep -qx teste; then echo "modo=teste" >> "$GITHUB_OUTPUT"; fi
            fi
          fi
          echo "lista=$lista" >> "$GITHUB_OUTPUT"
          echo "nome=$(echo "$lista" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Cache de narração (não paga duas vezes a mesma frase)
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Cache do modelo de reconhecimento de fala
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Gerar
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CHROME_CHANNEL: chrome
          LISTA: ${{ steps.alvo.outputs.lista }}
          FORMATO: ${{ inputs.formato || steps.alvo.outputs.formato || 'tudo' }}
          MODO: ${{ inputs.modo || steps.alvo.outputs.modo || 'gravada' }}
          VOZ: ${{ inputs.voz }}
        shell: bash
        run: |
          for p in $LISTA; do
            if [ -n "$VOZ" ]; then
              python -m fabrica.gerar "$p" --formato "$FORMATO" --modo "$MODO" --voz "$VOZ"
            else
              python -m fabrica.gerar "$p" --formato "$FORMATO" --modo "$MODO"
            fi
          done

      - name: Prévia em imagem (para conferência)
        if: always()
        shell: bash
        run: |
          mkdir -p previas
          for f in $(find saida -name "*.mp4"); do
            n=$(basename "$f" .mp4)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            fps=$(python3 -c "print(min(1.0, 60/float('$d')))")
            ffmpeg -loglevel error -y -i "$f" -vf "fps=$fps,scale=200:-1,tile=10x6" -frames:v 1 "previas/$n.jpg" || true
          done
          for c in $(find saida \( -name "capa_*.jpg" -o -name "miniatura_*.jpg" \)); do s=$(basename "$(dirname "$c")"); cp "$c" "previas/${s}_$(basename "$c")"; done
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          if [ -n "$(git status --porcelain previas)" ]; then
            git add previas && git commit -q -m "Prévias [skip ci]" && git pull --rebase -q && git push -q || true
          fi

      - name: Entregar arquivos (um pacote só)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.alvo.outputs.nome }}-${{ github.run_number }}
          path: saida/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Publicar no YouTube (fila + agendamento)
        if: ${{ env.YT_REFRESH_TOKEN != '' && (inputs.modo || steps.alvo.outputs.modo || 'gravada') != 'teste' }}
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: bash
        run: |
          python -m fabrica.publicar enfileirar saida
          python -m fabrica.publicar enviar
          python -m fabrica.publicar miniaturas saida
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git add publicados.json && git commit -m "Agenda do YouTube atualizada [skip ci]" && for t in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
