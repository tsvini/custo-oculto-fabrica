name: Gerar vídeo

on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "Projeto (nome da pasta em projetos/, ex.: kolynos)"
        required: true
      formato:
        description: "O que gerar"
        type: choice
        options: [tudo, longo, shorts, short1, short2, short3, tiktoks, tiktok1, tiktok2, tiktok3, tiktok4]
        default: tudo
      voz:
        description: "Trocar a voz sintética (só para modo google)"
        required: false
        default: ""
      modo:
        description: "gravada = seus áudios em projetos/<nome>/audio · teste = voz falsa · google = Chirp 3 HD (precisa de chave)"
        type: choice
        options: [gravada, teste, google]
        default: gravada
  push:
    paths: ["projetos/*/projeto.json", "projetos/*/audio/**", "projetos/*/regerar.txt"]

concurrency:
  group: gerar-${{ github.ref }}-${{ inputs.projeto || 'push' }}
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Descobrir projeto
        id: alvo
        shell: bash
        env:
          PROJETO: ${{ inputs.projeto }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lista="$PROJETO"
          else
            # primeiro commit não tem HEAD~1: compara com a árvore vazia
            if git rev-parse -q --verify HEAD~1 > /dev/null; then base=HEAD~1; else base=$(git hash-object -t tree /dev/null); fi
            mudou=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- 'projetos/*/projeto.json' 'projetos/*/audio/*' 'projetos/*/regerar.txt')
            lista=$(echo "$mudou" | { grep . || true; } | cut -d/ -f2 | sort -u | xargs)
            # só áudio de Short mudou? gera só os Shorts
            if [ -n "$mudou" ] && ! echo "$mudou" | grep -viq '/audio/shorts\?[0-9]'; then echo "formato=shorts" >> "$GITHUB_OUTPUT"; fi
            # só áudio de TikTok mudou? gera só os TikToks
            if [ -n "$mudou" ] && ! echo "$mudou" | grep -viq '/audio/tiktok[0-9]'; then echo "formato=tiktoks" >> "$GITHUB_OUTPUT"; fi
            # regerar.txt: a primeira palavra diz o formato (tudo, longo, shorts, short1…)
            r=$(echo "$mudou" | { grep '/regerar.txt$' || true; } | head -1)
            if [ -n "$r" ]; then echo "formato=$(head -1 "$r" | awk '{print $1}')" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "lista=$lista" >> "$GITHUB_OUTPUT"
          echo "nome=$(echo "$lista" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Cache de narração (não paga duas vezes a mesma frase)
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Cache do modelo de reconhecimento de fala
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Gerar
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          CHROME_CHANNEL: chrome
          LISTA: ${{ steps.alvo.outputs.lista }}
          FORMATO: ${{ inputs.formato || steps.alvo.outputs.formato || 'tudo' }}
          MODO: ${{ inputs.modo || 'gravada' }}
          VOZ: ${{ inputs.voz }}
        shell: bash
        run: |
          for p in $LISTA; do
            if [ -n "$VOZ" ]; then
              python -m fabrica.gerar "$p" --formato "$FORMATO" --modo "$MODO" --voz "$VOZ"
            else
              python -m fabrica.gerar "$p" --formato "$FORMATO" --modo "$MODO"
            fi
          done

      # pacotes separados: baixe só o que for usar (textos e miniaturas são leves)
      - name: Entregar textos, legendas e miniaturas
        uses: actions/upload-artifact@v4
        with:
          name: 1-textos-e-miniaturas-${{ steps.alvo.outputs.nome }}-${{ github.run_number }}
          path: |
            saida/**/*.txt
            saida/**/*.srt
            saida/**/*.jpg
            saida/**/*.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Entregar vídeo longo
        uses: actions/upload-artifact@v4
        with:
          name: 2-longo-${{ steps.alvo.outputs.nome }}-${{ github.run_number }}
          path: saida/**/*_longo.mp4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Entregar Shorts
        uses: actions/upload-artifact@v4
        with:
          name: 3-shorts-${{ steps.alvo.outputs.nome }}-${{ github.run_number }}
          path: saida/**/*_short*.mp4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Entregar TikToks
        uses: actions/upload-artifact@v4
        with:
          name: 4-tiktoks-${{ steps.alvo.outputs.nome }}-${{ github.run_number }}
          path: saida/**/*tiktok*.mp4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
