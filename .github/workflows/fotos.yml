name: Buscar fotos reais

on:
  push:
    paths: ["fotos/busca.txt"]

jobs:
  fotos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q pillow requests
          python ferramentas/buscar_fotos.py
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add previas fotos && git commit -q -m "Fotos candidatas [skip ci]" && git pull --rebase --autostash -q && git push -q || true
