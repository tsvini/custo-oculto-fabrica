name: Publicar nas redes

# Instagram, Facebook e TikTok direto pela API (sem Metricool). Lê agenda_redes.json e publica o que já passou do horário.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "publicar | testar"
        default: publicar

concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  redes:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Publicar
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO }}
        run: |
          python -m fabrica.redes ${{ inputs.acao || 'publicar' }}
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          if [ -n "$(git status --porcelain agenda_redes.json tiktok_token.enc)" ]; then
            git add agenda_redes.json $(ls tiktok_token.enc 2>/dev/null) && git commit -q -m "Agenda das redes [skip ci]" && for t in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
