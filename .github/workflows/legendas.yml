name: Legendas das aulas (Udemy)
on:
  workflow_dispatch:
    inputs:
      aulas:
        description: "aulas (ex.: 1 2 3); vazio = todas"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  legendas:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lote: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: |
          pip install -q imageio-ffmpeg faster-whisper numpy
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
      - name: Cache do modelo de reconhecimento de fala
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Gerar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p legendas tmp
          lista="${{ inputs.aulas }}"; [ -z "$lista" ] && lista="$(seq 1 83)"
          for n in $lista; do
            [ $(( n % 6 )) -eq ${{ matrix.lote }} ] || continue
            nn=$(printf %02d $n)
            gh release download videos -p "curso_playwright_${nn}_longo.mp4" -D tmp --clobber
            python ferramentas/legendas_udemy.py tmp/curso_playwright_${nn}_longo.mp4 $n legendas/aula${nn}.vtt || echo "::error title=Legenda::aula $nn falhou"
            rm -f tmp/*.mp4
          done
      - name: Guardar no repositório (curso-playwright/material/legendas)
        run: |
          mkdir -p curso-playwright/material/legendas && cp legendas/*.vtt curso-playwright/material/legendas/ 2>/dev/null || exit 0
          git config user.name "tsvini"; git config user.email "tsvini111@gmail.com"
          git add curso-playwright/material/legendas && git commit -qm "legendas das aulas (lote ${{ matrix.lote }}) [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
