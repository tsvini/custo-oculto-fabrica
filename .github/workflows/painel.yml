name: Painel

# Junta os números de todas as plataformas em docs/painel/dados.json (página no GitHub Pages). Todo dia às 7h40 e 19h40 de Brasília.
on:
  schedule:
    - cron: "40 10,22 * * *"
  workflow_dispatch:
  push:
    paths: ["fabrica/painel.py", ".github/workflows/painel.yml", "painel_manual.json", "publicados.json", "agenda_redes.json", "publicados_viniqa.json"]

concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  painel:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_QA: ${{ secrets.YT_REFRESH_TOKEN_QA }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          UDEMY_TOKEN: ${{ secrets.UDEMY_TOKEN }}
        run: |
          python -m fabrica.painel
          git config user.name "fabrica-custo-oculto"; git config user.email "fabrica@users.noreply.github.com"
          git add docs/painel $(ls tiktok_token.enc 2>/dev/null)
          git diff --cached --quiet || { git commit -q -m "Painel atualizado" && for t in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done; }
