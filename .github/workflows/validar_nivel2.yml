name: Validar código do nível 2 (Playwright)
on:
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      SAUCE_USER: standard_user
      SAUCE_PASSWORD: secret_sauce
      LOJA_USUARIO: cliente
      LOJA_SENHA: leigo123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: |
          cd curso-playwright/projeto && npm ci --silent
          timeout 240 npx playwright install --with-deps chromium >/dev/null 2>&1 || npx playwright install chromium >/dev/null
          cd ../projeto2 && npm install --silent >/dev/null
      - name: Rodar
        run: |
          set +e; S=$GITHUB_WORKSPACE/nivel2_resultado.txt; : > $S
          sec() { echo; echo "=================== $1"; } 
          cd curso-playwright/projeto
          { sec "MÓDULOS 12 E 13 (sem o teste visual)"; npx playwright test tests/nivel2 --project=chromium --reporter=list --retries=0 --grep-invert "não mudou" 2>&1; } >> $S
          { sec "VISUAL: 1ª vez (sem foto de referência)"; npx playwright test tests/nivel2 --project=chromium --reporter=list --retries=0 --grep "não mudou" 2>&1;
            sec "VISUAL: 2ª vez"; npx playwright test tests/nivel2 --project=chromium --reporter=list --retries=0 --grep "não mudou" 2>&1; } >> $S
          { sec "SMOKE"; npx playwright test tests/nivel2 --project=chromium --reporter=list --grep @smoke 2>&1; } >> $S
          { sec "FLAKY (repeat-each 10)"; npx playwright test -c playwright.demos.config.js aula70 --reporter=line --repeat-each=10 --retries=0 2>&1 | tail -25; } >> $S
          cd ../projeto2
          { sec "PROJETO 2 · versão 2"; npx playwright test --project=chromium --reporter=list 2>&1; } >> $S
          { sec "PROJETO 2 · versão 1 (com o bug)"; LOJA_VERSAO=1 npx playwright test produtos --project=chromium --reporter=list --retries=0 2>&1; } >> $S
          { sec "PROJETO 2 · smoke"; npx playwright test --project=chromium --reporter=list --grep @smoke 2>&1; } >> $S
          sed -i 's/\x1b\[[0-9;]*m//g' $S; tail -60 $S
      - name: Resultado na release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload bastidores nivel2_resultado.txt --clobber -R ${{ github.repository }} || true
