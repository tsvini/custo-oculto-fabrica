name: Validar a Lojinha (todos os navegadores e celulares)
on:
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: |
          cd curso-playwright/lojinha-teste
          npm install --silent @playwright/test@1.64.1 >/dev/null
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1
      - name: Rodar (no endereço de verdade, o que o aluno usa)
        run: |
          cd curso-playwright/lojinha-teste
          npx playwright test --reporter=list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "✘|failed|passed|flaky|Error:|Expected|Received" | tail -80
